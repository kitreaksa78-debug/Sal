name: Keep the API awake

# Render's free plan puts a web service to sleep after ~15 minutes without
# traffic, and the next visitor then waits 30-60 seconds for it to boot. One
# ping every 10 minutes keeps the dubbing API responsive (the free plan allows
# 750 instance-hours a month, which is enough for a single always-on service),
# so testing the site never starts with a cold start.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w '%{http_code}' \
              https://sal-juma.onrender.com/api/health || true)
            echo "attempt ${attempt} -> ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "the API did not answer 200 after three attempts" >&2
          exit 1
