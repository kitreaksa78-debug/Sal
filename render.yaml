# Render Blueprint — free web service, no credit card required.
#
# 1. Push this repository to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> pick this repo.
# 3. Render reads this file and creates the service; fill in the secret values
#    it asks for (they are marked sync: false, so they are never in git).
#
# The service builds with the repository's own scripts, then runs the bundled
# Express server (dist/server.cjs) which serves both the web UI and the API.
services:
  - type: web
    name: khmerdub-ai
    runtime: node
    plan: free
    region: singapore
    branch: main
    # --include=dev keeps vite/esbuild available: the build step needs them.
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STT_PROVIDER
        value: groq
      - key: TRANSLATION_PROVIDER
        value: groq

      # The keyless parts of the pipeline, pinned so they stay free even after a
      # paid key (Gemini, a hosted Khmer TTS) is added to this service:
      # Edge TTS pays nothing and needs no key; local_dsp separates speech from
      # music with the bundled FFmpeg, so both run without a quota.
      - key: TTS_PROVIDER
        value: edge
      - key: AUDIO_SEPARATION_PROVIDER
        value: local_dsp

      # Secrets — set these in the Render dashboard, not in git.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY2
        sync: false
      - key: GROQ_API_KEY3
        sync: false

      # Optional: persist uploads and results in Cloudflare R2. A free Render
      # instance has an ephemeral disk, so files are lost whenever it restarts.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Billing (LemonSqueezy). The API key is read-only and lets the server
      # resolve the checkout URL itself, so no buy link has to be hardcoded.
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      # Signing secret from LemonSqueezy -> Settings -> Webhooks. Without it the
      # webhook is refused and purchases are confirmed by email instead.
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      # Where buyers land after paying (used for the checkout redirect).
      - key: PUBLIC_APP_URL
        value: https://aivideotranslate.dev

      # Admin / owner accounts (comma separated). These get the full user list
      # and run without the free plan's 3-videos-a-day cap. Without this the
      # account that signed up first is treated as the owner.
      - key: OWNER_EMAILS
        value: kitreaksa78@gmail.com,kitreaksa78@gmail.com
