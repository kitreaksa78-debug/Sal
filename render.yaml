# Render Blueprint — free web service, no credit card required.
#
# 1. Push this repository to GitHub.
# 2. Render Dashboard -> New -> Blueprint -> pick this repo.
# 3. Render reads this file and creates the service; fill in the secret values
#    it asks for (they are marked sync: false, so they are never in git).
#
# The service builds with the repository's own scripts, then runs the bundled
# Express server (dist/server.cjs) which serves both the web UI and the API.
services:
  - type: web
    name: khmerdub-ai
    runtime: node
    plan: free
    region: singapore
    branch: main
    # --include=dev keeps vite/esbuild available: the build step needs them.
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Where the Demucs service lives: a phone tunnel, a Google Colab GPU, a
      # home server, or the bundled tools/audio-separator-server sidecar. A phone
      # tunnel URL changes every time it is reopened, so it can also be pasted
      # into the website's stem panel — which wins over this value.
      #
      # Separation is the whole product: with no service connected the upload
      # endpoint refuses every file.
      - key: AUDIO_SEPARATOR_URL
        sync: false
      - key: AUDIO_SEPARATOR_API_KEY
        sync: false

      # Gemini keys for the voice cleanup (សម្អាតសំឡេង). Several keys can be
      # pasted in one value, separated by commas; the app rotates through them and
      # through its model list when a quota runs out. They can also be saved from
      # the site's cleanup panel, which wins over this value.
      - key: GEMINI_API_KEYS
        sync: false

      # Optional: persist uploads and results in Cloudflare R2. A free Render
      # instance has an ephemeral disk, so files are lost whenever it restarts.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
